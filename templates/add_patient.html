<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Patient</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <h1>Add Patient</h1>
    <form method="POST">
        <label for="patient_id">Patient ID:</label>
        <input type="text" id="patient_id" name="patient_id" required><br>

        <label for="first_name">First Name:</label>
        <input type="text" id="first_name" name="first_name" required><br>

        <label for="last_name">Last Name:</label>
        <input type="text" id="last_name" name="last_name" required><br>

        <label for="date_of_birth">Date of Birth:</label>
        <input type="date" id="date_of_birth" name="date_of_birth" required><br>

        <label for="gender">Gender:</label>
        <input type="text" id="gender" name="gender" required><br>

        <label for="contact_number">Contact Number:</label>
        <input type="text" id="contact_number" name="contact_number" required><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required><br>

        <label for="address">Address:</label>
        <textarea id="address" name="address" required></textarea><br>

        <label for="medical_history">Medical History:</label>
        <textarea id="medical_history" name="medical_history" required></textarea><br>

        <label for="registration_date">Registration Date:</label>
        <input type="datetime-local" id="registration_date" name="registration_date" required><br>

        <label for="last_updated">Last Updated:</label>
        <input type="datetime-local" id="last_updated" name="last_updated" required><br>

        <label for="risk_level">Risk Level:</label>
        <input type="text" id="risk_level" name="risk_level" required><br>

        <button type="submit">Add Patient</button>
    </form>
</body>
</html>
