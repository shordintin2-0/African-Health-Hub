<!-- Delete Confirmation Modal Template -->
<div class="modal fade delete-confirmation-modal" id="deleteConfirmationModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-danger text-white">
                <h5 class="modal-title"><i class="fas fa-exclamation-triangle me-2"></i>Confirm Deletion</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <p>Are you sure you want to delete <strong><span id="deleteItemName"></span></strong>?</p>
                <div class="alert alert-danger">
                    <i class="fas fa-exclamation-triangle me-2"></i>
                    <strong>Warning:</strong> This action cannot be undone. All associated data will be permanently deleted.
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <form id="deleteForm" method="post" action="">
                    <button type="submit" class="btn btn-danger">Delete</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    // Function to set up the delete confirmation modal
    function setupDeleteConfirmation(itemName, deleteUrl) {
        const modal = document.getElementById('deleteConfirmationModal');
        const deleteItemNameEl = modal.querySelector('#deleteItemName');
        const deleteForm = modal.querySelector('#deleteForm');
        
        deleteItemNameEl.textContent = itemName;
        deleteForm.action = deleteUrl;
    }
</script>
